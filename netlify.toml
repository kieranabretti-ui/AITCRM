[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Recomputes SLA state and escalates tickets approaching/past their
# response deadline — Jira webhooks are event-driven, so nothing else
# fires when a deadline simply elapses with no new Jira activity.
[functions."sla-check"]
  schedule = "*/15 * * * *"

# Recomputes each active client's customer health score once a day —
# see netlify/functions/lib/healthScore.js. Runs early morning UK time
# so the Dashboard's "At-risk clients" panel is fresh for the day.
[functions."health-score"]
  schedule = "0 6 * * *"

# Drafts and sends a follow-up email to every Sales opportunity flagged
# due (see auto-follow-up.js) — off by default, only actually sends
# anything once AUTO_FOLLOW_UP_ENABLED=1 is set. Runs mid-morning UK
# time (after health-score, no dependency between the two — just kept
# off the same 6am slot).
[functions."auto-follow-up"]
  schedule = "0 8 * * *"

# React Router uses clean client-side URLs — without this, a direct
# visit or refresh on those paths 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Internal tool: not indexed, and locked down harder than the public
# site's CSP since it holds real client data.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # connect-src covers any Supabase project (*.supabase.co) so this
    # doesn't need editing when you plug in your own project URL.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
